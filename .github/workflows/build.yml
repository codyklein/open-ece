name: Build, test and package
on:
  push:
    branches: [main, feature/windows-support, feature/digital-logic, feature/sequential-logic, feature/circuit-analysis, feature/ac-analysis, feature/communications, feature/project-persistence, feature/v1-release-readiness, feature/v1.0.1-branding, feature/v1.1.0]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_candidate:
        description: 'Produce a signed candidate after windows-signing reviewer approval'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  fedora:
    name: Fedora 44 / ${{ matrix.compiler }} / ${{ matrix.gui }} / sanitizers=${{ matrix.sanitize }}
    runs-on: ubuntu-24.04
    container: fedora:44
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
        gui: ['ON', 'OFF']
        sanitize: ['OFF']
        include:
          - {compiler: clang++, gui: 'ON', sanitize: 'ON'}
          - {compiler: clang++, gui: 'OFF', sanitize: 'ON'}
    steps:
      - name: Install Fedora system packages
        run: dnf --disable-repo=fedora-cisco-openh264 install -y gcc-c++ clang compiler-rt cmake ninja-build git-core pkgconf-pkg-config qt6-qtbase-devel qwt-qt6-devel gtest-devel eigen3-devel json-devel clang-tools-extra
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DOPENECE_BUILD_GUI=${{ matrix.gui }} -DOPENECE_ENABLE_SANITIZERS=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: Test
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/ci --output-on-failure --output-junit results.xml
      - name: Formatting and diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
          git diff --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fedora-${{ matrix.compiler }}-gui-${{ matrix.gui }}-sanitize-${{ matrix.sanitize }}-logs
          path: |
            build/ci/Testing/
            build/ci/results.xml
            build/ci/example-*.log
            build/ci/compatibility-*.log
            build/ci/branding-*.log
            build/ci/CMakeFiles/CMakeConfigureLog.yaml
  windows:
    name: Windows MSVC 2022 / Qt 6.8.3 / Debug and Release
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64
      - name: Test release signing policy
        shell: pwsh
        run: ./scripts/windows/test-signing.ps1
      - name: Acquire exact Qt SDK
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 --archives qtbase --outputdir "$env:RUNNER_TEMP/Qt"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "QT_ROOT=$env:RUNNER_TEMP/Qt/6.8.3/msvc2022_64" >> $env:GITHUB_ENV
      - name: Capture MSVC toolset version
        id: msvc
        shell: pwsh
        run: |
          if (-not $env:VCToolsVersion) {
            throw "VCToolsVersion is not set by the MSVC developer environment."
          }
          "version=$env:VCToolsVersion" >> $env:GITHUB_OUTPUT

      - name: Restore pinned dependency build
        id: dependencies
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/windows-deps
          key: windows-x64-qt6.8.3-msvc${{ steps.msvc.outputs.version }}-${{ hashFiles('scripts/windows/bootstrap.ps1') }}
      - name: Bootstrap pinned Qwt, GoogleTest, Eigen and JSON
        shell: pwsh
        run: ./scripts/windows/bootstrap.ps1 -QtRoot $env:QT_ROOT
      - name: Verify bootstrap reuse
        shell: pwsh
        run: |
          $stamp = (Get-Item build/windows-deps/bootstrap-state.json).LastWriteTimeUtc
          ./scripts/windows/bootstrap.ps1 -QtRoot $env:QT_ROOT
          if ((Get-Item build/windows-deps/bootstrap-state.json).LastWriteTimeUtc -ne $stamp) { throw 'Bootstrap rebuilt intact dependencies.' }
      - name: Save verified dependency build
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/windows-deps
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Configure
        run: cmake --preset windows
      - name: Build and test Debug
        shell: pwsh
        run: |
          cmake --build --preset windows-debug --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset windows-debug --output-junit debug-results.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and test Release
        shell: pwsh
        run: |
          cmake --build --preset windows-release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset windows-release --output-junit release-results.xml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Benchmark communications resource limits
        shell: pwsh
        run: |
          cmake --build build/windows --config Release --target openece_communications_benchmark --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./build/windows/tests/Release/openece_communications_benchmark.exe | Tee-Object build/windows/communications-benchmark.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-persistence-probe
          path: build/windows/tests/Release/openece_packaged_persistence.exe
          if-no-files-found: error
      - name: Package Release
        id: package
        shell: pwsh
        env:
          SIGNED_CANDIDATE: ${{ inputs.signed_candidate || false }}
        run: |
          ./scripts/windows/package.ps1 -QtRoot $env:QT_ROOT -StageOnly:($env:SIGNED_CANDIDATE -eq 'true')
          $stagePath = (Get-Content build/packages/stage-location.txt -Raw).Trim()
          "stage-path=$stagePath" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.signed_candidate
        with:
          name: windows-release-stage
          path: ${{ steps.package.outputs.stage-path }}
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !inputs.signed_candidate }}
        with:
          name: OpenECE-v1.0.1-windows-x86_64
          path: build/packages/OpenECE-v1.0.1-windows-x86_64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-build-test-logs
          path: |
            build/windows/Testing/
            build/windows/*results.xml
            build/windows/example-*.log
            build/windows/compatibility-*.log
            build/windows/branding-*.log
            build/windows/communications-benchmark.log
            build/windows/CMakeFiles/CMakeConfigureLog.yaml
  sign-windows:
    name: Sign and verify Windows release candidate
    if: github.event_name == 'workflow_dispatch' && inputs.signed_candidate
    needs: [fedora, windows]
    runs-on: windows-2022
    timeout-minutes: 25
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-release-stage
          path: build/signing-stage
      - name: Verify staged inputs and existing vendor signatures
        id: stage
        shell: pwsh
        env:
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
        run: |
          if ($env:SIGNING_ACCOUNT -cne 'openece-signing-cody' -or $env:SIGNING_PROFILE -cne 'openece-public' -or
              $env:SIGNING_ENDPOINT -notmatch '^https://[a-z]+\.codesigning\.azure\.net/?$') { throw 'Unexpected signing configuration.' }
          $stage = Get-Content build/signing-stage/stage-inputs.json -Raw | ConvertFrom-Json
          if ($stage.sourceCommit -cne $env:GITHUB_SHA -or $stage.packageName -cne 'OpenECE-v1.0.1-windows-x86_64') { throw 'Stage does not match approved workflow commit/version.' }
          $root = (Resolve-Path "build/signing-stage/$($stage.packageName)").Path
          if (Test-Path "$root/SHA256SUMS.txt") { throw 'Signing stage already has a manifest.' }
          New-Item -ItemType Directory -Force build/signing-reports | Out-Null
          ./scripts/windows/test-signing.ps1
          ./scripts/windows/verify-signatures.ps1 -PackageDirectory $root -QwtRuntime $stage.qwtRuntime -Phase BeforeSigning -BaselinePath build/signing-reports/baseline.json -ReportPath build/signing-reports/before.json
          "package-root=$root" >> $env:GITHUB_OUTPUT
          "qwt-runtime=$($stage.qwtRuntime)" >> $env:GITHUB_OUTPUT
      - name: Azure OIDC login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign only OpenECE and the Release Qwt runtime
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2; reviewed pinned inputs/dependencies
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ steps.stage.outputs.package-root }}\openece.exe
            ${{ steps.stage.outputs.package-root }}\${{ steps.stage.outputs.qwt-runtime }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          append-signature: false
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          cache-dependencies: false
      - name: Verify signatures and vendor preservation, then manifest and ZIP
        shell: pwsh
        env:
          PACKAGE_ROOT: ${{ steps.stage.outputs.package-root }}
          QWT_RUNTIME: ${{ steps.stage.outputs.qwt-runtime }}
        run: |
          ./scripts/windows/verify-signatures.ps1 -PackageDirectory $env:PACKAGE_ROOT -QwtRuntime $env:QWT_RUNTIME -Phase AfterSigning -BaselinePath build/signing-reports/baseline.json -ReportPath build/signing-reports/after.json
          ./scripts/windows/finalize-package.ps1 -PackageDirectory $env:PACKAGE_ROOT -QwtRuntime $env:QWT_RUNTIME -RequireSigned
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenECE-v1.0.1-windows-x86_64
          path: |
            build/packages/OpenECE-v1.0.1-windows-x86_64.zip
            build/packages/OpenECE-v1.0.1-windows-x86_64.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-signature-verification
          path: build/signing-reports/
  packaged-startup:
    name: Packaged app / fresh Windows runner without Qt SDK
    needs: [windows, sign-windows]
    if: ${{ always() && needs.windows.result == 'success' && (!inputs.signed_candidate || needs.sign-windows.result == 'success') }}
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: OpenECE-v1.0.1-windows-x86_64
          path: build/artifact
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-persistence-probe
          path: build/persistence-probe
      - name: Extract, launch and test persistence with sanitized environment
        shell: pwsh
        env:
          SIGNED_CANDIDATE: ${{ inputs.signed_candidate || false }}
        run: ./scripts/windows/test-package.ps1 -Archive build/artifact/OpenECE-v1.0.1-windows-x86_64.zip -Destination "$env:RUNNER_TEMP/OpenECE fresh π path" -PersistenceProbe build/persistence-probe/openece_packaged_persistence.exe -RequireSigned:($env:SIGNED_CANDIDATE -eq 'true')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: windows-package-startup-logs
          path: |
            ${{ runner.temp }}/OpenECE fresh π path/*.log
            ${{ runner.temp }}/OpenECE fresh π path/signatures.json
